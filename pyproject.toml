[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cs2-price-checker"
version = "2.0.0"
description = "Track CS2 Steam Community Market prices in a Google Sheet"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "gspread>=6.1,<7",
    "requests>=2.31",
    "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cs2tracker = "cs2tracker.cli:main"

[tool.setuptools]
packages = ["cs2tracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
