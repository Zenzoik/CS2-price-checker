# /etc/nginx/sites-available/cs.example.com — then:
#   ln -s ../sites-available/cs.example.com /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d cs.example.com --redirect
server {
    listen 80;
    listen [::]:80;
    server_name cs.example.com;

    client_max_body_size 256k;

    location / {
        proxy_pass http://127.0.0.1:8080;  # CS2BOT_PORT
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
